name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: true

permissions:
  contents: write  # mirror sync-back commit

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check addon.js
          node --check plugin.js
          node --check dropbox-index.js

      - name: Sync embedded plugin mirror
        id: mirror
        run: |
          python3 scripts/sync_mirror.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy db-index
        run: python3 scripts/deploy_worker.py db-index dropbox-index.js
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}

      - name: Deploy db-addon
        run: python3 scripts/deploy_worker.py db-addon addon.js
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live endpoints
        run: |
          verify() {  # verify <label> <curl args...> -- retries up to 6x every 10s
            local label="$1"; shift
            for i in 1 2 3 4 5 6; do
              if "$@" >/dev/null 2>&1; then echo "$label: OK"; return 0; fi
              sleep 10
            done
            echo "$label: FAILED"; return 1
          }

          verify "index API" curl -sf --max-time 60 -H "User-Agent: Mozilla/5.0" \
            "https://db-index.gdrive3523.workers.dev/api/tv/" -o /dev/null

          verify "addon manifest" curl -sf --max-time 60 \
            "https://db-addon.gdrive3523.workers.dev/manifest.json" -o /dev/null

          # end-to-end stream pipeline: addon -> INDEX service binding -> TMDB -> Dropbox
          verify "movie streams endpoint (service binding chain)" \
            curl -sf --max-time 90 "https://db-addon.gdrive3523.workers.dev/stream/movie/tt1190080.json" \
            -o /tmp/movie.json
          python3 -c "import json;d=json.load(open('/tmp/movie.json'));assert 'streams' in d and isinstance(d['streams'],list)" \
            || { echo "movie stream response malformed"; exit 1; }

          verify "series streams endpoint" \
            curl -sf --max-time 90 "https://db-addon.gdrive3523.workers.dev/stream/series/tt0903747:1:1.json" \
            -o /tmp/series.json
          python3 -c "import json;d=json.load(open('/tmp/series.json'));assert 'streams' in d and isinstance(d['streams'],list)" \
            || { echo "series stream response malformed"; exit 1; }

          # Nuvio plugin must be byte-identical to plugin.js
          verify "nuvio plugin served" curl -sf --max-time 60 -H "User-Agent: Mozilla/5.0" \
            "https://db-addon.gdrive3523.workers.dev/plugin/plugin.js" -o /tmp/served.js
          node --check /tmp/served.js || { echo "served plugin has syntax errors"; exit 1; }
          cmp --silent /tmp/served.js plugin.js \
            || { echo "served plugin differs from plugin.js (mirror out of sync)"; exit 1; }
          echo "all endpoints verified"

      - name: Commit mirror sync-back
        if: steps.mirror.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon.js
          git commit -m "chore: sync embedded plugin mirror from plugin.js [skip ci]"
          git push
